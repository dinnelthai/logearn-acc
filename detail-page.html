<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代币详情页布局 — LogEarn</title>
  <meta name="description" content="代币详情页布局 · LogEarn 产品知识库">
<link rel="icon" type="image/png" href="shots/logo.png">
<style>
  :root{
    --bg: #0b0f0d;
    --bg-card: #121512;
    --bg-card-2: #171b17;
    --line: #24302a;
    --green: #3ddc84;
    --green-dim: #1f5c3f;
    --amber: #f2b544;
    --red: #e05a4e;
    --text: #e9efe9;
    --text-dim: #8ea092;
    --text-faint: #718075;
    --font-display: 'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{ scroll-behavior: smooth; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    line-height: 1.7;
    padding: 0 0 120px;
  }
  .wrap{ max-width: 820px; margin: 0 auto; padding: 0 24px; }

  header.hero{
    padding: 90px 24px 70px;
    border-bottom: 1px solid var(--line);
    background:
      radial-gradient(ellipse 600px 300px at 15% 0%, rgba(61,220,132,0.10), transparent 70%);
  }
  .backlink{
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--text-dim);
    text-decoration: none; margin-bottom: 22px;
  }
  .backlink:hover{ color: var(--green); }
  .brand{
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 28px;
  }
  .brand img{ width: 36px; height: 36px; border-radius: 9px; }
  .brand span{
    font-family: var(--font-display);
    font-weight: 500; font-size: 18px; letter-spacing: -0.01em;
  }
  .eyebrow{
    font-family: var(--font-display);
    font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--green); margin-bottom: 18px;
    display: flex; align-items: center; gap: 10px;
  }
  .eyebrow::before{ content: ""; width: 18px; height: 1px; background: var(--green); }
  h1{
    font-family: var(--font-display);
    font-weight: 500; font-size: 38px; line-height: 1.25; letter-spacing: -0.01em;
    max-width: 600px;
  }
  .lede{ margin-top: 20px; font-size: 17px; color: var(--text-dim); max-width: 560px; }

  section{ padding: 64px 24px; border-bottom: 1px solid var(--line); }
  section:last-of-type{ border-bottom: none; }
  h2{
    font-family: var(--font-display);
    font-weight: 500; font-size: 22px; margin-bottom: 8px;
  }
  .section-sub{ color: var(--text-dim); font-size: 15px; margin-bottom: 36px; max-width: 560px; }
  h3.sub{
    font-family: var(--font-display);
    font-weight: 500; font-size: 17px;
    margin: 48px 0 8px;
  }

  /* 区域清单 */
  .zones{ display: grid; gap: 12px; }
  .zone{
    display: grid; grid-template-columns: 34px 1fr; gap: 16px;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--bg-card); padding: 18px 20px;
  }
  .zone .num{
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--bg-card-2); border: 1px solid var(--green-dim);
    color: var(--green); font-family: var(--font-display);
    font-size: 12px; display: flex; align-items: center; justify-content: center;
    margin-top: 3px;
  }
  .zone h4{
    font-family: var(--font-display);
    font-weight: 500; font-size: 15.5px; margin-bottom: 4px;
  }
  .zone p{ font-size: 13.5px; color: var(--text-dim); }

  /* 截图 */
  .shot-block{ margin-bottom: 56px; }
  .shot-block:last-child{ margin-bottom: 0; }
  .shot-num{
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--font-display);
    font-size: 14px; font-weight: 500;
    color: var(--green); margin-bottom: 14px;
  }
  .shot-num .dot{
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--bg-card-2); border: 1px solid var(--green-dim);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
  }
  .shot-frame{
    position: relative;
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    background: var(--bg-card);
  }
  .shot-frame img{ display: block; width: 100%; height: auto; }
  .shot-frame.narrow{ max-width: 460px; margin: 0 auto; }
  .shot-frame.pending{
    min-height: 200px;
    display: flex; align-items: center; justify-content: center;
    border-style: dashed;
    color: var(--text-faint); font-size: 13px; text-align: center;
    padding: 40px 24px;
  }
  .callout{
    position: absolute;
    border: 1.5px dashed var(--red);
    border-radius: 6px;
    background: rgba(224,90,78,0.08);
    pointer-events: none;
  }
  .callout-label{
    position: absolute;
    background: var(--red); color: #2a0d0a;
    font-size: 12px; font-weight: 600;
    padding: 4px 10px; border-radius: 6px; white-space: nowrap;
  }
  .shot-caption{ margin-top: 12px; font-size: 14px; color: var(--text-dim); }
  .shot-caption code, .zone code{
    background: var(--bg-card-2); border: 1px solid var(--line);
    padding: 2px 7px; border-radius: 5px; font-size: 12.5px;
    color: var(--amber); font-family: ui-monospace, monospace;
  }

  /* 参数表 */
  .table-scroll{ overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .param-table{ width: 100%; border-collapse: collapse; font-size: 14.5px; min-width: 620px; }
  .param-table th{
    text-align: left;
    font-family: var(--font-display);
    font-weight: 500; font-size: 12.5px;
    letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text-faint);
    padding: 0 16px 14px 0; border-bottom: 1px solid var(--line);
  }
  .param-table td{
    padding: 16px 16px 16px 0;
    border-bottom: 1px solid var(--line);
    vertical-align: top; color: var(--text-dim);
  }
  .param-table tr:last-child td{ border-bottom: none; }
  .param-table .tab-col{ color: var(--green); font-size: 13px; white-space: nowrap; }
  .param-table .name-col{ color: var(--text); white-space: nowrap; }
  .filter-val{
    display: inline-block;
    background: var(--bg-card-2); border: 1px solid var(--line);
    padding: 2px 8px; border-radius: 5px; font-size: 12.5px;
    color: var(--amber); font-family: ui-monospace, monospace;
    white-space: nowrap;
  }

  .note{
    margin-top: 40px; padding: 16px 18px;
    border: 1px solid var(--line); border-left: 3px solid var(--amber);
    border-radius: 0 8px 8px 0; background: var(--bg-card);
    font-size: 13.5px; color: var(--text-dim);
  }
  .note.warn{ border-left-color: var(--red); }

  footer{ padding: 48px 24px 0; color: var(--text-faint); font-size: 13px; }
  footer a{ color: var(--text-dim); text-decoration: none; }
  footer a:hover{ color: var(--green); }

  @media (max-width: 640px){
    .wrap{ padding: 0 20px; }
    header.hero{ padding: 56px 20px 44px; }
    h1{ font-size: 27px; }
    .lede{ font-size: 15.5px; }
    section{ padding: 44px 20px; }
    h2{ font-size: 19px; }
    .section-sub{ font-size: 14px; margin-bottom: 26px; }
    .shot-block{ margin-bottom: 40px; }
    .callout-label{ font-size: 10.5px; padding: 3px 7px; }

    /* 参数表改成堆叠卡片 */
    .table-scroll{ overflow: visible; }
    .param-table{ min-width: 0; }
    .param-table tr:first-child{ display: none; }
    .param-table tr{ display: block; padding: 18px 0; border-bottom: 1px solid var(--line); }
    .param-table tr:last-child{ border-bottom: none; }
    .param-table td{ display: block; padding: 0; border: none; }
    .param-table td + td{ margin-top: 6px; }

    /* 对比表保留表头,改成横向滚动 */
    .table-scroll.keep{ overflow-x: auto; }
    .param-table.compare{ display: table; min-width: 500px; font-size: 13px; }
    .param-table.compare tr{ display: table-row; padding: 0; border: none; }
    .param-table.compare th{ display: table-cell; padding: 0 12px 12px 0; }
    .param-table.compare td{
      display: table-cell; padding: 12px 12px 12px 0;
      border-bottom: 1px solid var(--line); margin-top: 0;
    }
    .param-table.compare tr:last-child td{ border-bottom: none; }
  }
</style>
  <link rel="stylesheet" href="site.css">
</head>
<body>

  <header class="hero">
    <div class="lang-switch" style="text-align:right;margin-bottom:8px;"><a href="en/detail-page.html" style="color:var(--text-dim);text-decoration:none;font-size:13px;">EN / English</a></div>
      <div class="wrap">
      <a class="backlink" href="index.html">← 返回知识库</a>
      <div class="brand">
        <img src="shots/logo.png" alt="LogEarn logo">
        <span>LogEarn</span>
      </div>
      <div class="eyebrow">产品使用</div>
      <h1>代币详情页布局</h1>
      <div class="site-search" style="margin-top:20px; max-width:360px;"><input type="text" id="site-search-input" placeholder="搜索文档…" autocomplete="off"></div>
    </div>
  </header>

  <main id="content"></main>

  <footer>
    <div class="wrap"><a href="index.html">← 返回 LogEarn 知识库</a> · 产品使用说明</div>
  </footer>
  <script src="site.js"></script>
  <script src="search.js"></script>
</body>
</html>
