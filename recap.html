<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>复盘归档 — LogEarn</title>
<style>
  :root{
    --bg: #0b0f0d;
    --bg-card: #121512;
    --bg-card-2: #171b17;
    --line: #24302a;
    --green: #3ddc84;
    --green-dim: #1f5c3f;
    --amber: #f2b544;
    --text: #e9efe9;
    --text-dim: #8ea092;
    --text-faint: #5a685f;
    --font-display: 'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{ scroll-behavior: smooth; }
  body{
    background: var(--bg); color: var(--text);
    font-family: var(--font-ui); line-height: 1.7;
    padding: 0 0 120px;
  }
  .wrap{ max-width: 820px; margin: 0 auto; padding: 0 24px; }

  header.hero{
    padding: 90px 24px 70px;
    border-bottom: 1px solid var(--line);
    background: radial-gradient(ellipse 600px 300px at 15% 0%, rgba(61,220,132,0.10), transparent 70%);
  }
  .backlink{
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--text-dim);
    text-decoration: none; margin-bottom: 22px;
  }
  .backlink:hover{ color: var(--green); }
  .brand{
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 28px;
    font-family: var(--font-display);
    font-weight: 500; font-size: 18px; letter-spacing: -0.01em;
  }
  .eyebrow{
    font-family: var(--font-display);
    font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--green); margin-bottom: 18px;
    display: flex; align-items: center; gap: 10px;
  }
  .eyebrow::before{ content: ""; width: 18px; height: 1px; background: var(--green); }
  h1{
    font-family: var(--font-display);
    font-weight: 500; font-size: 38px; line-height: 1.25; letter-spacing: -0.01em;
    max-width: 600px;
  }
  .lede{ margin-top: 20px; font-size: 17px; color: var(--text-dim); max-width: 560px; }

  section{ padding: 64px 24px; border-bottom: 1px solid var(--line); }
  section:last-of-type{ border-bottom: none; }
  h2{ font-family: var(--font-display); font-weight: 500; font-size: 22px; margin-bottom: 8px; }
  .section-sub{ color: var(--text-dim); font-size: 15px; margin-bottom: 36px; max-width: 560px; }

  .video-card{
    display: grid; grid-template-columns: 48px 1fr; gap: 18px;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--bg-card); padding: 22px;
  }
  .video-card .play{
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--bg-card-2); border: 1px solid var(--green-dim);
    color: var(--green); display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .video-card h4{ font-family: var(--font-display); font-weight: 500; font-size: 16px; margin-bottom: 6px; }
  .video-card p{ font-size: 13.5px; color: var(--text-dim); margin-bottom: 14px; }
  .video-card .watch-link{
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--green); text-decoration: none;
    border: 1px solid var(--green-dim); border-radius: 100px;
    padding: 7px 14px;
  }
  .video-card .watch-link:hover{ background: var(--green-dim); color: var(--text); }

  .note{
    margin-top: 28px; padding: 16px 18px;
    border: 1px solid var(--line); border-left: 3px solid var(--amber);
    border-radius: 0 8px 8px 0; background: var(--bg-card);
    font-size: 13.5px; color: var(--text-dim);
  }

  footer{ padding: 48px 24px 0; color: var(--text-faint); font-size: 13px; }
  footer a{ color: var(--text-dim); text-decoration: none; }
  footer a:hover{ color: var(--green); }

  @media (max-width: 640px){
    .wrap{ padding: 0 20px; }
    header.hero{ padding: 56px 20px 44px; }
    h1{ font-size: 27px; }
    .lede{ font-size: 15.5px; }
    section{ padding: 44px 20px; }
    h2{ font-size: 19px; }
    .section-sub{ font-size: 14px; margin-bottom: 26px; }
  }
</style>
</head>
<body>

  <header class="hero">
    <div class="wrap">
      <a class="backlink" href="index.html">← 返回知识库</a>
      <div class="brand">LogEarn</div>
      <div class="eyebrow">复盘归档</div>
      <h1>每日复盘 & 直播回放</h1>
      <p class="lede">按日期整理的复盘视频和直播回放，方便回看关键行情与策略回顾。</p>
    </div>
  </header>

  <section>
    <div class="wrap">
      <h2>July 27 复盘</h2>
      <p class="section-sub">Telegram 视频回放。</p>

      <div class="video-card">
        <div class="play">▶</div>
        <div>
          <h4>July 27 复盘视频</h4>
          <p>当天行情回顾与策略执行要点。</p>
          <a class="watch-link" href="https://t.me/LogearnAcademy/678" target="_blank">▶ 观看视频(Telegram)</a>
        </div>
      </div>

      <div class="note">
        <strong>更多复盘陆续补充。</strong>后续会按日期逐条归档，方便按时间线查找。
      </div>
    </div>
  </section>

  <footer>
    <div class="wrap"><a href="index.html">← 返回 LogEarn 知识库</a> · 复盘归档</div>
  </footer>

</body>
</html>
